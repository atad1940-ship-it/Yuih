<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نموذج</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1c1e21;--mu:#6b7280;--pr:#0f766e;--pt:#fff;--bd:#d9dde3;--er:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2026;--tx:#eef0f2;--mu:#9aa3ad;--pr:#2dd4bf;--pt:#042f2e;--bd:#333b44;--er:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
h1{font-size:20px;margin:0 0 4px}
label{display:block;font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--pr);color:var(--pt);font:inherit;font-weight:700}
button:disabled{opacity:.5}
.mu{color:var(--mu);font-size:14px}.er{color:var(--er)}
.opt{display:flex;gap:8px;align-items:center;padding:4px 0;font-weight:400}.opt input{width:auto}
</style>
</head>
<body>
<main id="app"><p class="mu">جاري التحميل…</p></main>
<script>
const DB="https://katiba-b2d0b-default-rtdb.firebaseio.com";
const app=document.getElementById("app");
const fid=new URLSearchParams(location.search).get("f");
const h=(t,a,...k)=>{const e=document.createElement(t);for(const x in a||{}){const v=a[x];if(x==="class")e.className=v;else if(x.startsWith("on"))e.addEventListener(x.slice(2),v);else if(["value","checked","disabled","selected"].includes(x))e[x]=v;else e.setAttribute(x,v)}k.flat().forEach(c=>{if(c!=null&&c!==false)e.append(c)});return e};
const get=async p=>{const r=await fetch(`${DB}/${p}.json`);if(!r.ok)throw new Error(r.status);return r.json()};
const msg=(t,cls)=>app.replaceChildren(h("div",{class:"card "+(cls||"")},t));

(async()=>{
  if(!fid)return msg("الرابط غير صحيح.","er");
  let form,P;
  try{[form,P]=await Promise.all([get("forms/"+encodeURIComponent(fid)),get("people")])}
  catch{return msg("تعذّر تحميل النموذج. تحقق من الاتصال وأعد المحاولة.","er")}
  if(!form)return msg("هذا النموذج غير موجود أو تم حذفه.","er");
  const qs=(form.questions||[]).filter(Boolean);
  const people=Object.entries(P||{}).map(([id,x])=>({id,name:x.name})).sort((a,b)=>a.name.localeCompare(b.name,"ar"));
  const ans={};
  const who=h("select");
  const fill=txt=>{who.replaceChildren(h("option",{value:""},"— اختر اسمك —"),...people.filter(p=>!txt||p.name.includes(txt)).map(p=>h("option",{value:p.id},p.name)))};
  fill("");
  const err=h("p",{class:"er"});
  const btn=h("button",{onclick:send},"إرسال");
  function field(q,i){
    const k="q"+i;let c;
    if(q.type==="long")c=h("textarea",{rows:4,oninput:e=>ans[k]=e.target.value});
    else if(q.type==="number")c=h("input",{type:"number",inputmode:"decimal",oninput:e=>ans[k]=e.target.value});
    else if(q.type==="date")c=h("input",{type:"date",oninput:e=>ans[k]=e.target.value});
    else if(q.type==="yesno"||q.type==="choice"){
      const ops=q.type==="yesno"?["نعم","لا"]:(q.opts||[]);
      c=h("div",{},...ops.map(o=>h("label",{class:"opt"},h("input",{type:"radio",name:k,onchange:()=>ans[k]=o}),o)));
    }else c=h("input",{type:"text",oninput:e=>ans[k]=e.target.value});
    return h("div",{class:"card"},h("label",{},q.t+(q.req?" *":"")),c);
  }
  async function send(){
    err.textContent="";
    if(!who.value)return err.textContent="اختر اسمك من القائمة.";
    for(let i=0;i<qs.length;i++)if(qs[i].req&&!String(ans["q"+i]||"").trim())return err.textContent="أجب عن: "+qs[i].t;
    btn.disabled=true;
    const a={};for(const k in ans){const v=String(ans[k]).trim();if(v)a[k]=v}
    const body={ts:{".sv":"timestamp"}};if(Object.keys(a).length)body.answers=a;
    try{
      const r=await fetch(`${DB}/responses/${encodeURIComponent(fid)}/${who.value}.json`,{method:"PUT",body:JSON.stringify(body)});
      if(r.ok)return msg("تم الإرسال. شكرًا لك ✓");
      err.textContent=r.status===401||r.status===403?"هذا الاسم عبّأ النموذج من قبل. إن اخترت اسمًا بالخطأ فتواصل مع المسؤول.":"تعذّر الإرسال، أعد المحاولة.";
    }catch{err.textContent="تعذّر الإرسال، تحقق من الاتصال."}
    btn.disabled=false;
  }
  app.replaceChildren(
    h("div",{class:"card"},h("h1",{},form.title),form.desc&&h("p",{class:"mu"},form.desc)),
    h("div",{class:"card"},h("label",{},"الاسم الثلاثي *"),
      h("input",{type:"search",placeholder:"ابحث عن اسمك",oninput:e=>fill(e.target.value.trim())}),
      h("div",{style:"height:8px"}),who),
    ...qs.map(field),err,btn
  );
})();
</script>
</body>
</html>
